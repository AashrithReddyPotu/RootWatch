services:
  monitoring:
    build: ./services/monitoring
    environment:
      MOCK_MODE: "true"
      MOCK_SEED: "true"
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

  investigator:
    build: ./services/investigator
    environment:
      INCIDENT_PROVIDER: api
      MONITORING_API_URL: http://monitoring:8000
      USE_LLM: "false"
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      - monitoring
    ports:
      - "8001:8001"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - rootwatch_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_USE_MOCKS: "false"
      VITE_MONITORING_API: http://localhost:8000
      VITE_AI_API: http://localhost:8001/api/v1
    depends_on:
      - monitoring
      - investigator
    ports:
      - "5173:5173"

volumes:
  rootwatch_node_modules:
