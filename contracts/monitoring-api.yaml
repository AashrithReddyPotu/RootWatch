{
  "openapi": "3.1.0",
  "info": {
    "title": "RootWatch Monitoring API",
    "version": "1.0.0"
  },
  "paths": {
    "/health": {
      "get": {
        "summary": "Health",
        "operationId": "health_health_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          }
        }
      }
    },
    "/logs": {
      "post": {
        "summary": "Ingest",
        "operationId": "ingest_logs_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "items": {
                  "$ref": "#/components/schemas/ServerLog"
                },
                "type": "array",
                "title": "Rows"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": true,
                  "type": "object",
                  "title": "Response Ingest Logs Post"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/logs/recent": {
      "get": {
        "summary": "Recent Logs",
        "operationId": "recent_logs_logs_recent_get",
        "parameters": [
          {
            "name": "minutes",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1440,
              "minimum": 1,
              "default": 10,
              "title": "Minutes"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1000,
              "minimum": 1,
              "default": 100,
              "title": "Limit"
            }
          },
          {
            "name": "endpoint",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Endpoint"
            }
          },
          {
            "name": "error_type",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Error Type"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/ServerLog"
                  },
                  "title": "Response Recent Logs Logs Recent Get"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/analytics/error-frequency": {
      "get": {
        "summary": "Frequency",
        "operationId": "frequency_analytics_error_frequency_get",
        "parameters": [
          {
            "name": "endpoint",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Endpoint"
            }
          },
          {
            "name": "error_type",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Error Type"
            }
          },
          {
            "name": "minutes",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1440,
              "minimum": 1,
              "default": 10,
              "title": "Minutes"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/deployments": {
      "post": {
        "summary": "Deployment",
        "operationId": "deployment_deployments_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Deployment"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Deployment"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/incidents": {
      "get": {
        "summary": "Incidents",
        "operationId": "incidents_incidents_get",
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string",
                  "pattern": "^(active|resolved)$"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Status"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1000,
              "minimum": 1,
              "default": 100,
              "title": "Limit"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Incident"
                  },
                  "title": "Response Incidents Incidents Get"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/incidents/{incident_id}": {
      "get": {
        "summary": "Incident",
        "operationId": "incident_incidents__incident_id__get",
        "parameters": [
          {
            "name": "incident_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Incident Id"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Incident"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/incidents/{incident_id}/logs": {
      "get": {
        "summary": "Incident Logs",
        "operationId": "incident_logs_incidents__incident_id__logs_get",
        "parameters": [
          {
            "name": "incident_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Incident Id"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1000,
              "minimum": 1,
              "default": 100,
              "title": "Limit"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/ServerLog"
                  },
                  "title": "Response Incident Logs Incidents  Incident Id  Logs Get"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/deployments/recent": {
      "get": {
        "summary": "Deployments",
        "operationId": "deployments_deployments_recent_get",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 100,
              "minimum": 1,
              "default": 10,
              "title": "Limit"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Deployment"
                  },
                  "title": "Response Deployments Deployments Recent Get"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    },
    "/investigation/context/{incident_id}": {
      "get": {
        "summary": "Context",
        "operationId": "context_investigation_context__incident_id__get",
        "parameters": [
          {
            "name": "incident_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Incident Id"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1000,
              "minimum": 1,
              "default": 100,
              "title": "Limit"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Context"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Context": {
        "properties": {
          "incident": {
            "$ref": "#/components/schemas/Incident"
          },
          "recent_logs": {
            "items": {
              "$ref": "#/components/schemas/ServerLog"
            },
            "type": "array",
            "title": "Recent Logs"
          },
          "deployment": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Deployment"
              },
              {
                "type": "null"
              }
            ]
          },
          "statistics": {
            "$ref": "#/components/schemas/Statistics"
          }
        },
        "type": "object",
        "required": [
          "incident",
          "recent_logs",
          "deployment",
          "statistics"
        ],
        "title": "Context"
      },
      "Deployment": {
        "properties": {
          "deployment_version": {
            "type": "string",
            "minLength": 1,
            "title": "Deployment Version"
          },
          "deployed_at": {
            "type": "string",
            "format": "date-time",
            "title": "Deployed At"
          },
          "commit_hash": {
            "type": "string",
            "title": "Commit Hash"
          },
          "files_changed": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Files Changed"
          },
          "description": {
            "type": "string",
            "title": "Description"
          }
        },
        "type": "object",
        "required": [
          "deployment_version",
          "deployed_at",
          "commit_hash",
          "files_changed",
          "description"
        ],
        "title": "Deployment"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "Incident": {
        "properties": {
          "incident_id": {
            "type": "string",
            "title": "Incident Id"
          },
          "service": {
            "type": "string",
            "title": "Service"
          },
          "endpoint": {
            "type": "string",
            "title": "Endpoint"
          },
          "method": {
            "type": "string",
            "title": "Method"
          },
          "error_type": {
            "type": "string",
            "title": "Error Type"
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "resolved"
            ],
            "title": "Status"
          },
          "start_time": {
            "type": "string",
            "format": "date-time",
            "title": "Start Time"
          },
          "last_seen": {
            "type": "string",
            "format": "date-time",
            "title": "Last Seen"
          },
          "occurrence_count": {
            "type": "integer",
            "title": "Occurrence Count"
          },
          "failure_rate": {
            "type": "number",
            "title": "Failure Rate"
          },
          "severity": {
            "type": "string",
            "enum": [
              "medium",
              "high"
            ],
            "title": "Severity"
          },
          "deployment_version": {
            "type": "string",
            "title": "Deployment Version"
          }
        },
        "type": "object",
        "required": [
          "incident_id",
          "service",
          "endpoint",
          "method",
          "error_type",
          "status",
          "start_time",
          "last_seen",
          "occurrence_count",
          "failure_rate",
          "severity",
          "deployment_version"
        ],
        "title": "Incident"
      },
      "ServerLog": {
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "title": "Id"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time",
            "title": "Timestamp"
          },
          "service": {
            "type": "string",
            "minLength": 1,
            "title": "Service",
            "default": "careers-backend"
          },
          "endpoint": {
            "type": "string",
            "minLength": 1,
            "title": "Endpoint"
          },
          "method": {
            "type": "string",
            "enum": [
              "GET",
              "POST",
              "PUT",
              "PATCH",
              "DELETE",
              "HEAD",
              "OPTIONS"
            ],
            "title": "Method"
          },
          "status_code": {
            "type": "integer",
            "maximum": 599.0,
            "minimum": 100.0,
            "title": "Status Code"
          },
          "latency_ms": {
            "type": "number",
            "minimum": 0.0,
            "title": "Latency Ms"
          },
          "error_type": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Error Type"
          },
          "error_message": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Error Message"
          },
          "deployment_version": {
            "type": "string",
            "minLength": 1,
            "title": "Deployment Version"
          },
          "request_id": {
            "type": "string",
            "minLength": 1,
            "title": "Request Id"
          }
        },
        "type": "object",
        "required": [
          "timestamp",
          "endpoint",
          "method",
          "status_code",
          "latency_ms",
          "deployment_version"
        ],
        "title": "ServerLog"
      },
      "Statistics": {
        "properties": {
          "window_start": {
            "type": "string",
            "format": "date-time",
            "title": "Window Start"
          },
          "window_end": {
            "type": "string",
            "format": "date-time",
            "title": "Window End"
          },
          "total_requests": {
            "type": "integer",
            "title": "Total Requests"
          },
          "failed_requests": {
            "type": "integer",
            "title": "Failed Requests"
          },
          "failure_rate": {
            "type": "number",
            "title": "Failure Rate"
          },
          "average_latency_ms": {
            "type": "number",
            "title": "Average Latency Ms"
          },
          "error_counts": {
            "additionalProperties": {
              "type": "integer"
            },
            "type": "object",
            "title": "Error Counts"
          }
        },
        "type": "object",
        "required": [
          "window_start",
          "window_end",
          "total_requests",
          "failed_requests",
          "failure_rate",
          "average_latency_ms",
          "error_counts"
        ],
        "title": "Statistics"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}
